[package]
name = "slackers_unit_macro"
version = "0.1.11"
edition = "2024"
repository = "https://github.com/Slacker201/slackers_units/tree/main/slackers_unit_macro"
description = "The macros for slackers_units"
license = "MIT"

[dependencies]
slk-tokenstream = "0.6.0"
bnum = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
phf_codegen = {version="0.14.0", features=["quote"]}
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = {version = "3.0.9", features=["extra-traits"]}
module_path_extractor = "0.8.0"

[lib]
proc-macro = true

[lints.clippy]
cargo = { level = "warn", priority = -1 }

[features]
default = ["converter_8"]
converter_256 = []
converter_128 = []
converter_64 = []
converter_32 = []
converter_16 = []
converter_8 = []
converter_4 = []
converter_2 = []
converter_1 = []
