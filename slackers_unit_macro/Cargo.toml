[package]
name = "slackers_unit_macro"
version = "0.1.2"
edition = "2024"
repository = "https://github.com/Slacker201/slackers_units/tree/main/slackers_unit_macro"
description = "The macros for slackers_units"
license = "MIT"

[dependencies]
slk-tokenstream = "0.5.3"
bnum = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
phf_codegen = {version="0.14.0", features=["quote"]}
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = {version = "3.0.9", features=["extra-traits"]}

[lib]
proc-macro = true

[lints.clippy]
cargo = { level = "warn", priority = -1 }
