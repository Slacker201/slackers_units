[package]
name = "slackers_units"
version = "0.2.1"
edition = "2024"
description = "A small SI unit crate with compile time unit macros and generic holding types"
repository = "https://github.com/Slacker201/slackers_units"
license = "MIT"

[dependencies]
bnum = { version = "0.14.4", features = ["numtraits"] }
num-rational = "0.4.2"
num-traits = "0.2.19"
phf = {version="0.14.0", features=["macros"]}
slackers_unit_macro = { version = "0.1.6", path = "./slackers_unit_macro" }
slk-tokenstream = "0.5.3"
typenum = "1.20.1"

[dev-dependencies]
trybuild = "1.0.122"

[workspace]
resolver = "3"
members = ["slackers_unit_macro"]

[workspace.dependencies]
bnum = { version = "0.14.4", features = ["num-integer", "num-traits", "numtraits"] }
num-rational = "0.4.2"
num-traits = "0.2.19"
