[package]
name = "slackers_units"
version = "0.3.0"
edition = "2024"
description = "A small SI unit crate with compile time unit macros and generic holding types"
repository = "https://github.com/Slacker201/slackers_units"
license = "MIT"

[dependencies]
bnum = { version = "0.14.4", features = ["numtraits"] }
cfg-if = "1.0.5"
num-rational = "0.4.2"
num-traits = "0.2.19"
phf = {version="0.14.0", features=["macros"]}
slackers_unit_macro = { version = "0.1.9", path = "./slackers_unit_macro" }
slk-tokenstream = "0.5.3"
typenum = "1.20.1"

[dev-dependencies]
trybuild = "1.0.122"

[workspace]
resolver = "3"
members = ["slackers_unit_macro"]

[workspace.dependencies]
bnum = { version = "0.14.4", features = ["num-integer", "num-traits", "numtraits"] }
num-rational = "0.4.2"
num-traits = "0.2.19"

[features]
default = ["converter_8"]
converter_256 = ["slackers_unit_macro/converter_256"]
converter_128 = ["slackers_unit_macro/converter_128"]
converter_64 = ["slackers_unit_macro/converter_64"]
converter_32 = ["slackers_unit_macro/converter_32"]
converter_16 = ["slackers_unit_macro/converter_16"]
converter_8 = ["slackers_unit_macro/converter_8"]
converter_4 = ["slackers_unit_macro/converter_4"]
converter_2 = ["slackers_unit_macro/converter_2"]
converter_1 = ["slackers_unit_macro/converter_1"]
