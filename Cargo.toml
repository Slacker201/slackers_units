[package]
name = "slackers_units"
version = "0.1.1"
edition = "2024"
description = "A small SI unit crate with compile time unit macros and generic holding types"
repository = "https://github.com/Slacker201/slackers_si_units"
license = "MIT"

[dependencies]
fastnum = "0.7.5"
phf = {version="0.14.0", features=["macros"]}
slackers_unit_macro = { version = "0.1.1", path = "./slackers_unit_macro" }
typenum = "1.20.1"


[workspace]
resolver = "3"
members = ["slackers_unit_macro"]


[features]
